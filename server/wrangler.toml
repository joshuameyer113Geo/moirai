# Moirai shared-access proxy. See README.md in this folder for setup.
name = "moirai"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Workers Logs stay off. The worker itself only ever logs upstream HTTP status codes
# (never keys, codes, prompts, or replies).
[observability]
enabled = false

[vars]
DAILY_LIMIT = "100"
MAX_TOKENS = "1600"
ALLOWED_MODELS = "gpt-4.1,claude-sonnet-4-6,grok-4"
# ALLOWED_ORIGINS = "https://moirai.example.com"   # extra origins besides GitHub Pages + localhost

# Create with:  npx wrangler kv namespace create LIMITS
# then paste the printed id below.
[[kv_namespaces]]
binding = "LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (never put these in this file):
#   npx wrangler secret put ACCESS_CODES
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put XAI_API_KEY
