<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Moirai</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="description" content="Moirai asks ChatGPT, Claude, and Grok, then shows the thread they share." />
<meta name="theme-color" content="#f4f0e8" />
<style>
  :root { --bg:#f4f0e8; --panel:#fffcf7; --line:#e3dccf; --text:#1d1a16; --muted:#6f675c; --accent:#1e3f73; --gold:#8a7344; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Georgia, serif; }
  button, input, textarea { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
  header, main { max-width: 980px; margin: 0 auto; }
  header { padding: 22px 16px 6px; }
  h1 { margin: 0; font-size: 28px; }
  .lead, .note { color: var(--muted); font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  main { padding: 0 16px 56px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  textarea, input { width: 100%; background: #faf7f1; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  textarea { min-height: 96px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 999px; padding: 8px 13px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid { display: grid; gap: 10px; }
  @media (min-width: 840px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .out { white-space: pre-wrap; min-height: 72px; }
  .err { color: #8d3b32; font-size: 12px; }
</style>
</head>
<body>
<header><h1>Moirai</h1><p class="lead">Ask one Fate, or all three.</p></header>
<main>
  <section class="card">
    <textarea id="q" placeholder="Ask one clear question."></textarea>
    <div class="row">
      <button class="primary" id="ask">Ask all three</button>
      <button id="listen">Listen</button>
      <button id="speak">Speak thread</button>
      <button id="stopVoice">Stop</button>
      <button id="combine">Weave the thread</button>
    </div>
    <p class="note">Each panel has its own Ask button. Keys stay in this browser.</p>
    <details><summary>Keys</summary>
      <input id="openaiKey" type="password" placeholder="OpenAI key" />
      <input id="openaiModel" value="gpt-4.1" />
      <input id="anthropicKey" type="password" placeholder="Anthropic key" />
      <input id="claudeModel" value="claude-sonnet-4-6" />
      <input id="xaiKey" type="password" placeholder="xAI key" />
      <input id="grokModel" value="grok-4" />
    </details>
  </section>
  <section class="grid">
    <article class="card"><div class="head"><div class="kicker">Clotho · ChatGPT</div><span><button data-ask="gpt">Ask</button> <button data-speak="gpt">Speak</button></span></div><textarea id="gpt"></textarea><div class="err" id="gptErr"></div></article>
    <article class="card"><div class="head"><div class="kicker">Lachesis · Claude</div><span><button data-ask="claude">Ask</button> <button data-speak="claude">Speak</button></span></div><textarea id="claude"></textarea><div class="err" id="claudeErr"></div></article>
    <article class="card"><div class="head"><div class="kicker">Atropos · Grok</div><span><button data-ask="grok">Ask</button> <button data-speak="grok">Speak</button></span></div><textarea id="grok"></textarea><div class="err" id="grokErr"></div></article>
  </section>
  <section class="card"><div class="kicker">The thread</div><div class="out" id="synthesis">Ask one, or all three, then weave.</div></section>
</main>
<script>
const KEY="moirai-keys";
["openaiKey","openaiModel","anthropicKey","claudeModel","xaiKey","grokModel"].forEach(id=>{ const s=JSON.parse(localStorage.getItem(KEY)||"{}"); if(s[id]) document.getElementById(id).value=s[id]; document.getElementById(id).onchange=()=>{ const d={}; ["openaiKey","openaiModel","anthropicKey","claudeModel","xaiKey","grokModel"].forEach(k=>d[k]=document.getElementById(k).value.trim()); localStorage.setItem(KEY, JSON.stringify(d)); }; });
function speak(text){ if(!window.speechSynthesis){ alert("This browser cannot speak."); return;} speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text||"").slice(0,4000)); speechSynthesis.speak(u); }
document.getElementById("speak").onclick=()=>speak(synthesis.textContent);
document.getElementById("stopVoice").onclick=()=>{ speechSynthesis.cancel(); if(window._hear) window._hear.stop(); listen.textContent="Listen"; };
document.querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>speak(document.getElementById(b.dataset.speak).value));
document.getElementById("listen").onclick=()=>{ const Rec=window.SpeechRecognition||window.webkitSpeechRecognition; if(!Rec){ alert("This browser cannot listen. Open in Safari."); return;} if(window._hear && listen.textContent==="Listening"){ window._hear.stop(); return;} const hear=new Rec(); window._hear=hear; hear.lang="en-US"; hear.interimResults=true; hear.onresult=e=>{ q.value=[...e.results].map(r=>r[0].transcript).join(" "); }; hear.onend=()=>listen.textContent="Listen"; hear.onerror=()=>{ listen.textContent="Listen"; alert("Allow the microphone."); }; listen.textContent="Listening"; hear.start(); };
function weave(){ const packs=[["ChatGPT",gpt.value],["Claude",claude.value],["Grok",grok.value]].filter(p=>p[1].trim()); synthesis.textContent = packs.length<2 ? "Need at least two replies." : packs.map(p=>p[0]+":\n"+p[1].trim().slice(0,600)).join("\n\n"); }
document.getElementById("combine").onclick=weave;
async function askOne(url, headers, body){ const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)}); const data=await res.json(); if(!res.ok) throw new Error(data.error&&data.error.message||res.statusText); return data; }
function callers(question){ return {
  gpt: () => openaiKey.value.trim() ? askOne("https://api.openai.com/v1/chat/completions", {Authorization:"Bearer "+openaiKey.value.trim(),"Content-Type":"application/json"}, {model:openaiModel.value||"gpt-4.1", messages:[{role:"user",content:question}]}).then(d=>d.choices[0].message.content) : Promise.reject(new Error("No OpenAI key.")),
  claude: () => anthropicKey.value.trim() ? askOne("https://api.anthropic.com/v1/messages", {"x-api-key":anthropicKey.value.trim(),"anthropic-version":"2023-06-01","content-type":"application/json"}, {model:claudeModel.value||"claude-sonnet-4-6", max_tokens:1200, messages:[{role:"user",content:question}]}).then(d=>(d.content||[]).map(c=>c.text||"").join("\n")) : Promise.reject(new Error("No Anthropic key.")),
  grok: () => xaiKey.value.trim() ? askOne("https://api.x.ai/v1/chat/completions", {Authorization:"Bearer "+xaiKey.value.trim(),"Content-Type":"application/json"}, {model:grokModel.value||"grok-4", messages:[{role:"user",content:question}]}).then(d=>d.choices[0].message.content) : Promise.reject(new Error("No xAI key."))
}; }
async function askIds(ids){ const question=q.value.trim(); if(!question) return; const jobs=callers(question); await Promise.all(ids.map(async id=>{ const box=document.getElementById(id); const prior=box.value; if(!prior) box.value="Asking…"; try { box.value=await jobs[id](); document.getElementById(id+"Err").textContent=""; } catch(err){ if(!prior) box.value=""; document.getElementById(id+"Err").textContent=/fetch|cors/i.test(String(err))?"Browser blocked the call. Paste the reply.":String(err.message||err);} })); if(ids.length>1) weave(); }
document.getElementById("ask").onclick=()=>askIds(["gpt","claude","grok"]);
document.querySelectorAll("[data-ask]").forEach(btn=>btn.onclick=()=>askIds([btn.dataset.ask]));
</script>
</body>
</html>
