<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Moirai</title>
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#f4f0e8" />
<style>
  :root { --bg:#f4f0e8; --panel:#fffcf7; --line:#e3dccf; --text:#1d1a16; --muted:#6f675c; --accent:#1e3f73; --gold:#8a7344; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Georgia, serif; }
  button, input, textarea { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
  header, main { max-width: 980px; margin: 0 auto; }
  header { padding: 22px 16px 6px; display: flex; gap: 14px; align-items: center; }
  h1 { margin: 0; font-size: 28px; }
  .lead, .note { color: var(--muted); font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  main { padding: 0 16px 56px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  textarea, input { width: 100%; background: #faf7f1; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  textarea { min-height: 96px; }
  .row, .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  button, .chip { border: 1px solid var(--line); background: #fff; color: var(--text); border-radius: 999px; padding: 8px 13px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid { display: grid; gap: 10px; }
  @media (min-width: 840px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
  .kicker { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .out { white-space: pre-wrap; min-height: 72px; }
  .err { color: #8d3b32; font-size: 12px; }
  .head { display: flex; justify-content: space-between; }
</style>
</head>
<body>
<header><div><h1>Moirai</h1><p class="lead">Listen, ask, then hear the thread.</p></div></header>
<main>
  <section class="card">
    <textarea id="q" placeholder="Ask one clear question."></textarea>
    <div class="row">
      <button class="primary" id="ask">Ask all three</button>
      <button id="listen">Listen</button>
      <button id="speak">Speak thread</button>
      <button id="stopVoice">Stop</button>
      <button id="combine">Weave the thread</button>
    </div>
    <p class="note">Allow the microphone when asked. On iPhone, open this page in Safari.</p>
    <details>
      <summary>Keys</summary>
      <input id="openaiKey" type="password" placeholder="OpenAI key" />
      <input id="openaiModel" value="gpt-4.1" />
      <input id="anthropicKey" type="password" placeholder="Anthropic key" />
      <input id="claudeModel" value="claude-sonnet-4-6" />
      <input id="xaiKey" type="password" placeholder="xAI key" />
      <input id="grokModel" value="grok-4" />
    </details>
  </section>
  <section class="grid">
    <article class="card"><div class="head"><div class="kicker">Clotho</div><button data-speak="gpt">Speak</button></div><textarea id="gpt"></textarea><div class="err" id="gptErr"></div></article>
    <article class="card"><div class="head"><div class="kicker">Lachesis</div><button data-speak="claude">Speak</button></div><textarea id="claude"></textarea><div class="err" id="claudeErr"></div></article>
    <article class="card"><div class="head"><div class="kicker">Atropos</div><button data-speak="grok">Speak</button></div><textarea id="grok"></textarea><div class="err" id="grokErr"></div></article>
  </section>
  <section class="card"><div class="kicker">The thread</div><div class="out" id="synthesis">Ask, or paste two replies, then weave.</div></section>
</main>
<script>
const KEY="moirai-keys";
["openaiKey","openaiModel","anthropicKey","claudeModel","xaiKey","grokModel"].forEach(id=>{const s=JSON.parse(localStorage.getItem(KEY)||"{}"); if(s[id]) document.getElementById(id).value=s[id]; document.getElementById(id).onchange=()=>{const d={}; ["openaiKey","openaiModel","anthropicKey","claudeModel","xaiKey","grokModel"].forEach(k=>d[k]=document.getElementById(k).value.trim()); localStorage.setItem(KEY, JSON.stringify(d));};});
function speak(text){ if(!window.speechSynthesis){ alert("This browser cannot speak."); return;} speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(String(text||"").slice(0,4000)); const v=speechSynthesis.getVoices().find(x=>/en/i.test(x.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }
document.getElementById("speak").onclick=()=>speak(synthesis.textContent);
document.getElementById("stopVoice").onclick=()=>{ speechSynthesis.cancel(); if(window._hear) window._hear.stop(); listen.textContent="Listen"; };
document.querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>speak(document.getElementById(b.dataset.speak).value));
document.getElementById("listen").onclick=()=>{ const Rec=window.SpeechRecognition||window.webkitSpeechRecognition; if(!Rec){ alert("This browser cannot listen. On iPhone, open the page in Safari."); return;} if(window._hear && listen.textContent==="Listening"){ window._hear.stop(); return;} const hear=new Rec(); window._hear=hear; hear.lang="en-US"; hear.interimResults=true; hear.onresult=e=>{ q.value=[...e.results].map(r=>r[0].transcript).join(" "); }; hear.onend=()=>listen.textContent="Listen"; hear.onerror=()=>{ listen.textContent="Listen"; alert("Listening failed. Allow the microphone."); }; listen.textContent="Listening"; hear.start(); };
function weave(){ const packs=[["ChatGPT",gpt.value],["Claude",claude.value],["Grok",grok.value]].filter(p=>p[1].trim()); if(packs.length<2){ synthesis.textContent="Need at least two replies."; return;} synthesis.textContent=packs.map(p=>p[0]+":\n"+p[1].trim().slice(0,500)).join("\n\n"); }
document.getElementById("combine").onclick=weave;
async function askOne(url, headers, body){ const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)}); const data=await res.json(); if(!res.ok) throw new Error(data.error&&data.error.message||res.statusText); return data; }
document.getElementById("ask").onclick=async()=>{ const question=q.value.trim(); if(!question) return; const jobs=[["gpt", async()=>{ if(!openaiKey.value.trim()) throw new Error("No OpenAI key."); const d=await askOne("https://api.openai.com/v1/chat/completions",{Authorization:"Bearer "+openaiKey.value.trim(),"Content-Type":"application/json"},{model:openaiModel.value||"gpt-4.1",messages:[{role:"user",content:question}]}); return d.choices[0].message.content; }],["claude", async()=>{ if(!anthropicKey.value.trim()) throw new Error("No Anthropic key."); const d=await askOne("https://api.anthropic.com/v1/messages",{"x-api-key":anthropicKey.value.trim(),"anthropic-version":"2023-06-01","content-type":"application/json"},{model:claudeModel.value||"claude-sonnet-4-6",max_tokens:1200,messages:[{role:"user",content:question}]}); return (d.content||[]).map(c=>c.text||"").join("\n"); }],["grok", async()=>{ if(!xaiKey.value.trim()) throw new Error("No xAI key."); const d=await askOne("https://api.x.ai/v1/chat/completions",{Authorization:"Bearer "+xaiKey.value.trim(),"Content-Type":"application/json"},{model:grokModel.value||"grok-4",messages:[{role:"user",content:question}]}); return d.choices[0].message.content; }]]; await Promise.all(jobs.map(async ([id,fn])=>{ try { document.getElementById(id).value=await fn(); document.getElementById(id+"Err").textContent=""; } catch(err){ document.getElementById(id+"Err").textContent=/fetch|cors/i.test(String(err))?"Browser blocked the call. Paste the reply.":String(err.message||err);} })); weave(); };
</script>
</body>
</html>
